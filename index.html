<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Marks Calculator</title>
</head>
<body>
    <main class="System">
        <h1>Student Marks Calculator</h1>
        <section class="add">
            <h2>Add Subjects</h2>
            <input id="subjectInput" placeholder="Enter your Subject Name">
            <input id="marksInput" type="number" placeholder="Enter Marks">
            <button id="addSubject">Add Subject</button>       
        </section>
        <section class="display">
            <div id="subjectList"></div>
            <button id="calculateResult">Calculate Result</button>
            <div id="result"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
